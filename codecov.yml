# Coverage is measured in the browser-mode test gate and gated here (ADR 0021).
# project: total ratio must not drop (auto baseline). patch: new/changed code must be tested.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: 80%
        informational: false

comment:
  layout: 'condensed_header, diff, files'
  require_changes: 'coverage_drop OR uncovered_patch'
