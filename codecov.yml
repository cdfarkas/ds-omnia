# Coverage is measured in the browser-mode test gate (ADR 0021); ADR 0031 sets these statuses.
# project: any drop against the base fails. patch: changed lines at least as covered as the base.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        target: auto
        informational: false

comment:
  layout: 'condensed_header, diff, files'
  require_changes: 'coverage_drop OR uncovered_patch'
