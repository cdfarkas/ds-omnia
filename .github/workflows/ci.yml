name: CI

# PR-only by design: the merge to main is the same tree these checks already
# passed, and Release + Pages cover push-to-main. Each job below is its own PR
# check. The one exception is `test`, which also runs on push to main so it
# uploads a coverage report — that report is the base Codecov's project status
# compares every PR against, which never exists if coverage only runs on PRs.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  build-storybook:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build-storybook

  manifest:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm docs:manifest
      - name: Fail if the component manifest is stale
        run: git diff --exit-code -- docs/components.json docs/components.md
